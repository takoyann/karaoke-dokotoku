<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>カラオケどこ得？</title><link rel="stylesheet" href="./style.css"></head><body><header><h1>🎤 カラオケどこ得？</h1><p>移動時間・料金・追加オプションまでまとめて比較</p></header><main><section class="card"><h2>条件</h2><div class="grid"><label>出発地点<input id="origin" placeholder="駅名・住所・施設名"></label><label>移動手段<select id="mode"><option value="transit">公共交通機関＋徒歩</option><option value="car">車</option></select></label><label>人数<input id="people" type="number" min="1" value="2"></label><label>歌う時間<input id="duration" type="number" min="30" step="30" value="120"></label><label>利用者<select id="customer"><option value="student_member">学生会員</option><option value="student">学生</option><option value="member">会員</option><option value="general">一般</option></select></label></div><p><label class="check"><input id="potato" type="checkbox"> ポテト</label><label class="check"><input id="alcohol" type="checkbox"> アルコール飲み放題</label></p><button id="go">最安を探す</button><p id="status"></p></section><div id="results"></div><section class="card note"><b>注意</b><br>このZIPは動作確認用の初期データ入りです。料金の「未検証」データは実際の支払額として利用しないでください。</section></main><script src="./config.js"></script><script src="./app.js"></script></body></html>
