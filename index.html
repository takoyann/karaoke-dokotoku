<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>カラオケどこ得？</title><link rel="stylesheet" href="style.css"></head><body>
<header><div class="wrap"><h1>🎤 カラオケどこ得？</h1><p>移動時間・交通費・料金・ポテト・飲み放題までまとめて比較</p></div></header>
<main class="wrap">
<section class="card"><h2>条件</h2><div class="grid">
<label>出発地点<input id="origin" placeholder="駅名・住所・施設名"></label>
<label>移動手段<select id="mode"><option value="transit">公共交通＋徒歩</option><option value="car">車</option><option value="walk">徒歩</option></select></label>
<label>人数<input id="people" type="number" min="1" value="2"></label>
<label>歌う時間<input id="duration" type="number" min="30" step="30" value="120"><small>分</small></label>
<label>利用者<select id="customer"><option value="student_member">学生会員</option><option value="student">学生</option><option value="member">会員</option><option value="general">一般</option></select></label>
<label>曜日<select id="day"><option value="weekday">平日</option><option value="weekend_holiday">土日祝</option></select></label>
</div><div class="checks"><label><input id="potato" type="checkbox"> ポテトを追加</label><label><input id="alcohol" type="checkbox"> アルコール飲み放題を追加</label><label><input id="includeTravelCost" type="checkbox" checked> 交通費も総額に含める</label></div><button id="search">最安を探す</button><p id="routeNote" class="muted"></p></section>
<section><div id="status" class="muted">データ読込中…</div><div id="results"></div></section>
</main><script src="config.js"></script><script src="app.js"></script></body></html>
