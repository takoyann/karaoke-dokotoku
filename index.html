<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>カラオケどこ得？</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="hero">
    <div>
      <p class="eyebrow">KARAOKE PRICE COMPARER</p>
      <h1>カラオケどこ得？</h1>
      <p>人数・移動手段・追加注文まで含めて、「結局どこが得か」を比較する。</p>
    </div>
  </header>

  <main class="container">
    <section class="panel">
      <h2>条件を入力</h2>

      <div class="grid">
        <label>
          出発地点
          <input id="origin" type="text" placeholder="例：京都橘大学">
        </label>

        <label>
          人数
          <input id="partySize" type="number" min="1" value="2">
        </label>

        <label>
          利用時間
          <select id="duration">
            <option value="2">2時間</option>
            <option value="3" selected>3時間</option>
            <option value="4">4時間</option>
            <option value="5">5時間</option>
          </select>
        </label>

        <label>
          移動手段
          <select id="transport">
            <option value="transit">公共交通＋徒歩</option>
            <option value="car">車</option>
            <option value="walk">徒歩</option>
          </select>
        </label>
      </div>

      <div class="checks">
        <label><input id="potato" type="checkbox"> ポテトを付ける</label>
        <label><input id="alcohol" type="checkbox"> アルコール飲み放題を付ける</label>
      </div>

      <button id="compare">比較する</button>
      <p class="notice">※現在は動作確認用のサンプル店舗データです。料金・ルートAPIは次の段階で接続します。</p>
    </section>

    <section>
      <div class="result-head">
        <h2>比較結果</h2>
        <span id="resultCount"></span>
      </div>
      <div id="results"></div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
