<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="カラオケ店舗の料金を比較して、自分に合ったお店を探せるサービスです。">
  <title>カラオケどこ得？｜カラオケ料金比較</title>
  <link rel="stylesheet" href="./style.css">
  <script src="./app.js" defer></script>
</head>
<body>
  <header class="site-header">
    <a class="logo" href="./">カラオケどこ得？</a>
    <p class="header-subtitle">カラオケ料金比較サービス</p>
  </header>

  <main class="container">
    <section class="hero">
      <p class="eyebrow">KARAOKE PRICE COMPARISON</p>
      <h1>カラオケ、どこが一番お得？</h1>
      <p class="hero-description">
        エリアや駅名から店舗を探して、料金を比較できます。
      </p>
    </section>

    <section class="search-panel" aria-labelledby="search-title">
      <h2 id="search-title">店舗を探す</h2>

      <label for="search">店舗名・チェーン名・駅名</label>
      <input
        id="search"
        type="search"
        placeholder="例：京都駅、まねきねこ"
        autocomplete="off"
      >

      <div class="select-row">
        <div class="form-field">
          <label for="prefecture">都道府県</label>
          <select id="prefecture">
            <option value="">すべての都道府県</option>
          </select>
        </div>

        <div class="form-field">
          <label for="city">市区町村</label>
          <select id="city">
            <option value="">すべての市区町村</option>
          </select>
        </div>
      </div>

      <div class="comparison-options">
  <h3>利用条件</h3>

  <div class="select-row">
    <div class="form-field">
      <label for="people">利用人数</label>
      <select id="people">
        <option value="1">1名</option>
        <option value="2" selected>2名</option>
        <option value="3">3名</option>
        <option value="4">4名</option>
        <option value="5">5名</option>
        <option value="6">6名</option>
        <option value="8">8名</option>
        <option value="10">10名</option>
      </select>
    </div>

    <div class="form-field">
      <label for="hours">利用時間</label>
      <select id="hours">
        <option value="1">1時間</option>
        <option value="2" selected>2時間</option>
        <option value="3">3時間</option>
        <option value="4">4時間</option>
        <option value="5">5時間</option>
      </select>
    </div>
  </div>

  <div class="select-row">
    <div class="form-field">
      <label for="day-type">利用日</label>
      <select id="day-type">
        <option value="weekday">平日</option>
        <option value="weekend">土日祝</option>
      </select>
    </div>

    <div class="form-field">
      <label for="time-type">時間帯</label>
      <select id="time-type">
        <option value="daytime">昼</option>
        <option value="night">夜</option>
      </select>
    </div>
  </div>

  <div class="form-field">
    <label for="plan">料金プラン</label>
    <select id="plan">
      <option value="normal">通常料金</option>
      <option value="student">学生料金</option>
      <option value="freeTime">フリータイム</option>
    </select>
  </div>
</div>
      <p class="search-note">
        ※現在、掲載店舗と料金データを順次整備しています。
      </p>
    </section>

    <section class="results-section" aria-labelledby="results-title">
      <div class="results-heading">
        <h2 id="results-title">検索結果</h2>
        <span id="result-count">0店舗</span>
      </div>

      <div id="store-list" class="store-list" aria-live="polite">
        <p>店舗情報を読み込んでいます。</p>
      </div>
    </section>

    <section class="notice">
      <h2>料金について</h2>
      <p>
        料金は店舗・曜日・時間帯・利用プランなどによって異なります。
        ご利用前に各店舗の公式情報をご確認ください。
      </p>
    </section>
  </main>

  <footer class="site-footer">
    <p>カラオケどこ得？</p>
    <p>掲載情報は順次更新しています。</p>
  </footer>
</body>
</html>
