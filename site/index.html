<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#202a44"><title>カラオケどこ得？</title><meta name="description" content="条件を入れてカラオケ料金の目安を比較"><link rel="stylesheet" href="./style.css"><script defer src="./app.js"></script></head><body><header><p class="eyebrow">KARAOKE PRICE FINDER</p><h1>カラオケ、<span>どこ得？</span></h1><p>人数・時間・条件から料金の目安をまとめて比較。</p><p class="notice">※以下は動作確認用の仮料金です。実店舗の料金ではありません。</p></header><main><section class="panel"><h2>利用条件</h2><form id="search-form"><div class="grid"><label>出発地（任意）<input id="origin" placeholder="例：京阪 寝屋川市駅"></label><label>移動方法<select id="transport"><option value="transit">電車・徒歩</option><option value="car">車</option><option value="walk">徒歩</option></select></label><label>利用時間<select id="duration"><option value="1">1時間</option><option value="2" selected>2時間</option><option value="3">3時間</option><option value="4">4時間</option><option value="5">5時間</option><option value="6">6時間</option></select></label><label>人数<input id="people" type="number" min="1" max="20" value="2" required></label><label>曜日<select id="day"><option value="weekday">平日</option><option value="weekend">金土日・祝前日</option></select></label><label>会員・学生条件<select id="discount"><option value="none">一般・割引なし</option><option value="member">会員料金（想定）</option><option value="student">学生料金（想定）</option></select></label></div><div class="checks"><label><input id="potato" type="checkbox"> ポテトも考慮（1皿）</label><label><input id="drink" type="checkbox" checked> ドリンクバーを含める</label><label><input id="alcohol" type="checkbox"> アルコール飲み放題を含める</label></div><button type="submit">料金を比較する</button> <button type="button" id="reset" class="secondary">初期設定に戻す</button></form></section><section class="panel"><div class="result-head"><div><h2>比較結果</h2><p id="summary">条件を選んで比較してな。</p></div><label>並び順<select id="sort"><option value="total">合計が安い順</option><option value="hourly">1人1時間あたりが安い順</option><option value="name">チェーン名順</option></select></label></div><div id="results-list" aria-live="polite"><p class="empty">読み込み中…</p></div><p class="notice dark">表示額は比較ロジック確認用の仮データです。店舗別料金、フリータイム、交通費、経路検索は未実装です。来店前に公式情報を確認してください。</p></section></main><footer>カラオケどこ得？ — 比較の目安を、わかりやすく。</footer></body></html>
